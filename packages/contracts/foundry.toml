# Foundry configuration for Lumina contracts.
# Build/verify against the Solidity compiler used by the FAsset toolchain.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
verbosity = 2
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "./broadcast" }]

# Remappings for packages installed via pnpm (node_modules).
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@flarenetwork/=node_modules/@flarenetwork/",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
